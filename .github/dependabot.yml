version: 2
updates:
  # Python backend (requirements.txt + requirements_dev.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    groups:
      python-patch:
        update-types: ["patch", "minor"]
        exclude-patterns: ["django"]
      python-major:
        update-types: ["major"]
        patterns: ["django"]
    ignore:
      # Django 6.x blocked: django-cors-headers, django-celery-results and
      # drf-spectacular do not declare Django 6.1 support yet.
      # See development/blocked-upgrades.md
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]

  # Frontend (frontend/package.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-security:
        dependency-type: "production"
        update-types: ["patch", "minor"]
      frontend-eslint:
        patterns: ["eslint*", "@eslint/*"]
      frontend-babel-webpack:
        patterns: ["@babel/*", "webpack*"]
      frontend-i18n:
        patterns: ["i18next*", "react-i18next"]
      frontend-mui:
        patterns: ["@mui/*", "@emotion/*"]
    ignore:
      # Blocked major upgrades — see development/blocked-upgrades.md
      # OpenPGP v6 renamed curve25519 → curve25519Legacy, breaking robot key generation.
      - dependency-name: "openpgp"
        update-types: ["version-update:semver-major"]
      # Babel 8 breaks the build; config incompatibilities not yet resolved.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # ESLint 10 config/plugin work not yet completed.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/*"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-n ^18 and eslint-plugin-react-hooks ^7 require ESLint 10.
      - dependency-name: "eslint-plugin-n"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is chained behind the ESLint 10 work landing first.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Electron desktop app (desktopApp/package.json)
  - package-ecosystem: "npm"
    directory: "/desktopApp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "desktop"
    groups:
      desktop-all:
        patterns: ["*"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      ci-artifact-pipeline:
        patterns: ["actions/upload-artifact", "dawidd6/action-download-artifact"]
      ci-docker:
        patterns: ["docker/*"]
      ci-misc:
        patterns: ["*"]

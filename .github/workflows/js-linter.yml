name: "Lint: Javascript Client"
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**/*.js'
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**/*.js'
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: 'Setup node'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 'Install NPM Dependencies'
        run: |
          cd frontend
          npm ci

      - name: 'Run TypeScript type-check'
        run: |
          cd frontend
          npm run typecheck

      - name: 'Run EsLint'
        run: |
          cd frontend
          npm run lint

      - name: 'Run Prettier'
        run: |
          cd frontend
          npm run format:check

      - name: 'Run Jest unit tests with coverage'
        run: |
          cd frontend
          npm test -- --coverage

      - name: 'Restore coverage baseline from cache'
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: actions/cache/restore@v4
        with:
          path: .coverage-baseline/frontend-coverage-summary.json
          key: frontend-coverage-main-${{ github.sha }}
          restore-keys: |
            frontend-coverage-main-

      - name: 'Check coverage has not regressed'
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          node .github/scripts/check-frontend-coverage.js \
            .coverage-baseline/frontend-coverage-summary.json \
            frontend/coverage/coverage-summary.json

      - name: 'Copy summary to baseline dir before saving'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .coverage-baseline
          cp frontend/coverage/coverage-summary.json .coverage-baseline/frontend-coverage-summary.json

      - name: 'Save coverage baseline to cache'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .coverage-baseline/frontend-coverage-summary.json
          key: frontend-coverage-main-${{ github.sha }}

name: "Lint: Javascript Client"
permissions:
  contents: read

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
    paths:
      - 'frontend/**/*.js'
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**/*.js'
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: 'Setup node'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ESLint and Prettier must be in `package.json`
      - name: 'Install NPM Dependencies'
        run: |
          cd frontend
          npm ci

      - name: 'Run TypeScript type-check'
        run: |
          cd frontend
          npm run typecheck

      - name: 'Run EsLint'
        run: |
          cd frontend
          npm run lint

      - name: 'Run Prettier'
        run: |
          cd frontend
          npm run format:check

      - name: 'Audit dependencies'
        # Checks for high/critical vulns in RoboSats deps only.
        # Excludes node_modules/npm/** — vulnerabilities inside npm's own
        # bundled sub-dependencies are not shipped with the application.
        run: |
          cd frontend
          HIGH_VULNS=$(npm audit --json 2>/dev/null \
            | jq '[.vulnerabilities | to_entries[]
                   | select(.value.severity == "high" or .value.severity == "critical")
                   | select(.value.nodes | all(startswith("node_modules/npm/") | not))
                  ] | length')
          echo "High/critical vulnerabilities outside npm internals: $HIGH_VULNS"
          if [ "$HIGH_VULNS" -gt 0 ]; then
            npm audit --audit-level=high 2>&1 || true
            exit 1
          fi

name: "Test: Coordinator"

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ "main" ]
    paths:
      - "api/**"
      - "chat/**"
      - "control/**"
      - "robosats/**"
      - "requirements.txt"
      - "requirements_dev.txt"
      - "Dockerfile"
  pull_request:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements_dev.txt'
      - 'Dockerfile'

permissions:
  contents: read
  actions: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-tag: ['3.12.3-slim-bookworm']

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5

    - name: 'Download static files Artifact'
      uses: dawidd6/action-download-artifact@v11
      with:
        workflow: frontend-build.yml
        workflow_conclusion: success
        name: django-main-static
        path: frontend
        if_no_artifact_found: ignore

    - name: Patch Dockerfile
      run: |
        sed -i "1s/FROM python:.*/FROM python:${{ matrix.python-tag }}/" Dockerfile

    - uses: satackey/action-docker-layer-caching@v0.0.11
      continue-on-error: true
      with:
        key: coordinator-docker-cache-${{ hashFiles('Dockerfile', 'requirements.txt', 'requirements_dev.txt') }}
        restore-keys: |
          coordinator-docker-cache-

    - name: 'Build coordinator image'
      run: docker compose -f docker-tests.yml build coordinator
      env:
        ROBOSATS_ENVS_FILE: ".env-sample"

    - name: 'Export coordinator image'
      run: docker save backend-image | gzip > backend-image.tar.gz

    - name: 'Upload coordinator image artifact'
      uses: actions/upload-artifact@v4
      with:
        name: backend-image-${{ github.run_id }}
        path: backend-image.tar.gz
        retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    strategy:
      max-parallel: 2
      matrix:
        python-tag: ['3.12.3-slim-bookworm']
        lnd-version: ['v0.18.2-beta']
        cln-version: ['v24.08']
        ln-vendor: ['LND', 'CLN']

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v5

    - name: 'Download static files Artifact'
      uses: dawidd6/action-download-artifact@v11
      with:
        workflow: frontend-build.yml
        workflow_conclusion: success
        name: django-main-static
        path: frontend
        if_no_artifact_found: ignore

    - name: 'Download coordinator image artifact'
      uses: actions/download-artifact@v4
      with:
        name: backend-image-${{ github.run_id }}

    - name: 'Load coordinator image'
      run: docker load < backend-image.tar.gz

    - name: Patch .env-sample
      run: |
        sed -i "s/^LNVENDOR=.*/LNVENDOR='${{ matrix.ln-vendor }}'/" .env-sample

    - name: 'Compose Regtest Orchestration'
      uses: isbang/compose-action@v2.4.0
      with:
        compose-file: "./docker-tests.yml"
        down-flags: "--volumes"
        services: |
          bitcoind
          postgres
          redis
          coordinator-${{ matrix.ln-vendor }}
          robot-LND
          coordinator
      env:
        LND_VERSION: ${{ matrix.lnd-version }}
        CLN_VERSION: ${{ matrix.cln-version }}
        ROBOSATS_ENVS_FILE: ".env-sample"

    - name: Wait for coordinator (django server)
      run: |
        while [ "$(docker inspect --format "{{.State.Health.Status}}" test-coordinator)" != "healthy" ]; do
          echo "Waiting for coordinator to be healthy..."
          sleep 5
        done

    - name: 'Run tests with coverage'
      run: |
        docker exec test-coordinator coverage run manage.py test
        docker exec test-coordinator coverage report
        docker exec test-coordinator coverage html
      env:
        LNVENDOR: ${{ matrix.ln-vendor }}
        DEVELOPMENT: True
        USE_TOR: False

    - name: 'Upload coverage report'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-tag }}-${{ matrix.ln-vendor }}-${{ github.run_id }}
        path: htmlcov/

# Ammanaya Coordinator Mainnet Locations
location /mainnet/ammanaya/static/assets/avatars/ {
    proxy_pass http://mainnet_ammanaya/static/assets/avatars/;
}

location /mainnet/ammanaya/api/ {
    # if ($request_method = 'OPTIONS') {
    #     add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    #     add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    #     add_header 'Access-Control-Max-Age' 1728000;
    #     add_header 'Content-Type' 'text/plain; charset=utf-8';
    #     add_header 'Content-Length' 0;
    #     return 204;
    # }
    # if ($request_method = 'POST') {
    #     add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    #     add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    #     add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
    # }
    # if ($request_method = 'GET') {
    #     add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    #     add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    #     add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
    # }
    proxy_pass http://mainnet_ammanaya/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
}

location /mainnet/ammanaya/ws/ {
    proxy_pass http://mainnet_ammanaya/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
}

location /mainnet/ammanaya/relay/ {
    proxy_pass http://mainnet_ammanaya/relay/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Origin $http_origin;
    proxy_set_header Host $host;

    add_header Access-Control-Allow-Origin *;
}

location /mainnet/ammanaya/blossom/ {
    proxy_pass http://mainnet_ammanaya/blossom/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 12m;
}

